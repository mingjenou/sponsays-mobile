appId: com.sponsays.preview
name: P0 guest recommendation journey
---
- launchApp:
    clearState: true
- assertVisible: 'Stop deciding.*'
- tapOn: 'Try SponSays without an account'
- assertVisible: 'What should we do?'
- tapOn: 'SPONSAY ME ✦'
- assertVisible: 'SponSays says…'
- tapOn: "I’M IN"
- assertVisible: "YOU’RE GOING."
- assertVisible: 'GET DIRECTIONS'
- tapOn: '👍 Yes'
- assertVisible: 'Got it — thanks.'
